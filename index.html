<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #0f172a, #1e2937);
            color: #e0f2fe;
        }
        h1 {
            margin-bottom: 10px;
            font-size: 3rem;
            color: #60a5fa;
            text-shadow: 0 4px 12px rgba(0,0,0,0.5);
        }
        .mode-toggle {
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
        .status {
            font-size: 1.5rem;
            margin-bottom: 20px;
            min-height: 2.5rem;
            color: #bae6fd;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: #1e2937;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .cell {
            width: 130px;
            height: 130px;
            background: #334155;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #e0f2fe;
            box-shadow: inset 0 6px 12px rgba(0,0,0,0.4);
        }
        .cell:hover { background: #475569; transform: scale(1.05); }
        .cell.x { color: #60a5fa; }
        .cell.o { color: #f472b6; }
        .controls {
            margin-top: 30px;
        }
        button {
            padding: 12px 32px;
            font-size: 1.1rem;
            background: #1e40af;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #3b82f6;
            transform: translateY(-3px);
        }
        .winner { animation: win 0.6s ease; }
        @keyframes win {
            0% { transform: scale(1); }
            50% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <h1>Tic Tac Toe</h1>
    
    <div class="mode-toggle">
        <label>
            <input type="checkbox" id="aiMode" onchange="toggleAIMode()">
            Play against AI
        </label>
    </div>
    
    <div class="status" id="status">X's turn</div>
    
    <div class="board" id="board"></div>
    
    <div class="controls">
        <button onclick="resetGame()">New Game</button>
    </div>

    <script>
        let currentPlayer = 'X';
        let gameState = ['', '', '', '', '', '', '', '', ''];
        let gameActive = true;
        let aiMode = false;
        
        const winningConditions = [
            [0,1,2],[3,4,5],[6,7,8],
            [0,3,6],[1,4,7],[2,5,8],
            [0,4,8],[2,4,6]
        ];
        
        const board = document.getElementById('board');
        const statusDisplay = document.getElementById('status');
        
        function createBoard() {
            board.innerHTML = '';
            gameState.forEach((_, index) => {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.dataset.index = index;
                cell.addEventListener('click', handleCellClick);
                board.appendChild(cell);
            });
        }
        
        function handleCellClick(e) {
            const index = parseInt(e.target.dataset.index);
            if (gameState[index] !== '' || !gameActive || (aiMode && currentPlayer === 'O')) return;
            makeMove(index, e.target);
        }
        
        function makeMove(index, cell) {
            gameState[index] = currentPlayer;
            cell.textContent = currentPlayer;
            cell.classList.add(currentPlayer.toLowerCase());
            
            const winResult = checkWin();
            if (winResult) {
                gameActive = false;
                statusDisplay.textContent = `${currentPlayer} wins! 🎉`;
                highlightWinningCells(winResult);
                return;
            }
            
            if (gameState.every(c => c !== '')) {
                gameActive = false;
                statusDisplay.textContent = "It's a draw! 🤝";
                return;
            }
            
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            statusDisplay.textContent = `${currentPlayer}'s turn`;
            
            if (aiMode && currentPlayer === 'O' && gameActive) {
                setTimeout(aiMove, 350);
            }
        }
        
        function checkWin() {
            for (let cond of winningConditions) {
                const [a,b,c] = cond;
                if (gameState[a] && gameState[a] === gameState[b] && gameState[a] === gameState[c]) {
                    return cond;
                }
            }
            return null;
        }
        
        function highlightWinningCells(combo) {
            combo.forEach(i => board.children[i].classList.add('winner'));
        }
        
        function aiMove() {
            let bestScore = -Infinity;
            let bestMove = null;
            
            for (let i = 0; i < 9; i++) {
                if (gameState[i] === '') {
                    gameState[i] = 'O';
                    let score = minimax(gameState, 0, false);
                    gameState[i] = '';
                    if (score > bestScore) {
                        bestScore = score;
                        bestMove = i;
                    }
                }
            }
            if (bestMove !== null) {
                makeMove(bestMove, board.children[bestMove]);
            }
        }
        
        function minimax(state, depth, isMaximizing) {
            if (checkWin()) return isMaximizing ? -10 : 10;
            if (state.every(c => c !== '')) return 0;
            
            if (isMaximizing) {
                let best = -Infinity;
                for (let i = 0; i < 9; i++) {
                    if (state[i] === '') {
                        state[i] = 'O';
                        best = Math.max(best, minimax(state, depth+1, false));
                        state[i] = '';
                    }
                }
                return best;
            } else {
                let best = Infinity;
                for (let i = 0; i < 9; i++) {
                    if (state[i] === '') {
                        state[i] = 'X';
                        best = Math.min(best, minimax(state, depth+1, true));
                        state[i] = '';
                    }
                }
                return best;
            }
        }
        
        function toggleAIMode() {
            aiMode = document.getElementById('aiMode').checked;
            resetGame();
        }
        
        function resetGame() {
            currentPlayer = 'X';
            gameState = ['', '', '', '', '', '', '', '', ''];
            gameActive = true;
            statusDisplay.textContent = "X's turn";
            createBoard();
        }
        
        // Start game
        createBoard();
    </script>
</body>
</html>
